name: macOS release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    env:
      LEGACY_UPDATE_CONNECTION: ${{ secrets.FLOWBOARD_CONNECTION_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run test:release
      - run: npm run build:cloud
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-worker
          path: dist/cloudflare/index.js
          retention-days: 7
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: 行记 v__VERSION__
          releaseBody: 共享看板、个人开发记录、Markdown 知识库与统一行记 Skill；本地离线保存与低频检查点。Apple Silicon / Intel 通用应用。
          releaseDraft: false
          uploadUpdaterJson: true
          args: --target universal-apple-darwin --bundles app,dmg
      - if: env.LEGACY_UPDATE_CONNECTION != ''
        run: node scripts/prepare-ci.mjs
        env:
          FLOWBOARD_CONNECTION_JSON: ${{ secrets.FLOWBOARD_CONNECTION_JSON }}
      - if: env.LEGACY_UPDATE_CONNECTION != ''
        run: node scripts/publish-updates.mjs native
