name: macOS release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run test:release
      - run: npm run build:cloud
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-worker
          path: dist/cloudflare/index.js
          retention-days: 7
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: 行记 v__VERSION__
          releaseBody: |
            - 将多周任务归入一张计划卡。卡面可打开、完成或撤销当前任务，也可查看完整计划，拖动标题可整组移列。
            - 月历默认在截止日显示未完成任务。在卡片或选定日期加入日历后，从开始日连续显示到截止日。勾选后自动归入完成栏，撤销可恢复原栏目。
            - 圆点和小旗区分安排日与截止日，颜色区分今天截止、近期截止和已逾期。手动 High 与卡片自选色可同时显示。

            macOS 通用安装包支持 Apple Silicon 和 Intel。已安装的用户可在行记设置中检查更新。
          releaseDraft: false
          uploadUpdaterJson: true
          args: --target universal-apple-darwin --bundles app,dmg
