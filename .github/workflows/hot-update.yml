name: Frontend hot update
on:
  workflow_dispatch:
    inputs:
      version:
        description: '界面版本号，例如 1.0.1；必须高于已发布的界面版本'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: frontend-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: node scripts/prepare-ci.mjs
        env:
          FLOWBOARD_CONNECTION_JSON: ${{ secrets.FLOWBOARD_CONNECTION_JSON }}
      - run: npm run build:desktop
      - run: cargo install tauri-plugin-hot-update --version 0.1.1 --features cli --locked
      - run: node scripts/sign-hot-update.mjs
        env:
          HOT_UPDATE_VERSION: ${{ inputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - run: node scripts/publish-updates.mjs hot
        env:
          HOT_UPDATE_VERSION: ${{ inputs.version }}
